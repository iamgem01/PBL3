  # Notification Service #
  - name: notification-service
    host: notification-service
    port: 5004
    protocol: http
    connect_timeout: 60000
    read_timeout: 60000
    write_timeout: 60000
    retries: 5
    plugins:
      - name: cors
        config:
          origins:
            - http://localhost:3000
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Accept-Encoding
            - Content-Type
            - Authorization
            - Origin
            - X-User-Id  
          exposed_headers:
            - Set-Cookie
          max_age: 3600
          preflight_continue: false
          credentials: true

    routes:
      - name: notification-resource
        paths:
          - /api/notifications
        methods: [GET, POST, PATCH, DELETE, OPTIONS]
        strip_path: false
        preserve_host: false
        protocols: [http, https]

      
consumers:
  - username: api-user
    jwt_secrets:
      - key: Aeternus
        secret: SessionTokenCreatedBySecret22222222222222222222222222222222222222
        algorithm: HS256

plugins:
  - name:  rate-limiting
    config:
      second: 100
      minute: 1000
      hour: 10000
      policy: redis
      fault_tolerant: false
      hide_client_headers: false
      limit_by: ip
      redis:
        host: redis
        port: 6379
        password: xinchaocacban
  - name: pre-function
    config:
      access:
        - |
          local path = ngx.var.uri
          -- Whitelist: Bỏ qua kiểm tra token cho các trang Login, OAuth2, và Signup
          -- Sử dụng string.find để khớp prefix, tránh lỗi khi có query params (ví dụ: /login/oauth2/code/google?code=...)
          if string.find(path, "/login") == 1 or string.find(path, "/oauth2/") == 1 or path == "/api/users" or string.find(path, "/error") == 1 then
            return
          end

          local http = require "resty.http"
          if ngx.req.get_method() == "OPTIONS" then
            return
          end

          local httpc = http.new()
          
          -- 1. Thử lấy từ Header Authorization
          local auth_header = ngx.req.get_headers()["Authorization"]
          local token = nil
          
          if auth_header and string.find(auth_header, "Bearer ") then
            token = auth_header -- Giữ nguyên cả chuỗi "Bearer ..."
          else 
            -- 2. Fallback: Thử lấy từ Cookie
            -- Chỉ cho phép dùng cookie tại endpoint /api/auth/me (xác nhận phiên)
            if path == "/api/auth/me" or path == "/api/users/me" then
                local cookie_val = ngx.var["cookie_SESSION_TOKEN"] or ngx.var["cookie_session_token"]
                if cookie_val then
                   -- Loại bỏ prefix "Bearer " nếu đã tồn tại trong cookie để tránh bị double
                   local clean_cookie = string.gsub(cookie_val, "^Bearer%s+", "")
                   token = "Bearer " .. clean_cookie
                   ngx.log(ngx.INFO, "DEBUG: token=" .. token)
                   
                else
                   ngx.log(ngx.ERR, "DEBUG: Cookie not found. Path: " .. path .. " | All Cookies: " .. (ngx.var.http_cookie or "nil"))
                end
            end
          end

          if not token then 
            ngx.status = 401
            ngx.say("{\"message\":\"Unauthenticated\"}")
            ngx.exit(401)
          else 
            ngx.log(ngx.INFO, "DEBUG: token=" .. token)
          end 

          local res, err = httpc:request_uri("http://user-service:8082/api/auth/validate", {
            method = "GET",
            headers = {
              ["Authorization"] = token
            }
          })

          if not res then
            ngx.log(ngx.ERR, "DEBUG: Failed to call user-service: " .. (err or "unknown"))
            ngx.status = 500
            ngx.exit(500)
          end

          if res.status == 302 then
            ngx.log(ngx.ERR, "DEBUG: Spring Security is blocking access! (302 Redirect detected). Please add '/api/auth/validate' to permitAll() in SecurityConfig.")
            ngx.status = 401
            ngx.exit(401)
          end

          if res.status ~= 200 then
            ngx.log(ngx.ERR, "DEBUG: user-service returned status: " .. res.status)
            ngx.status = 401
            ngx.exit(401)
          end

          -- If validation is successful, add the Authorization header to the request for the upstream service.
          ngx.req.set_header("Authorization", token)
